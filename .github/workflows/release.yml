# Release system depends on:
# - .releaserc.json (make sure to select the right branch)
# - .github/workflows/semantic-pr-check.yml

name: Release

#on:
#  push:
#    branches:
#      - main

# Only run releases manually
on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install semantic-release
        run: |
          npm install --no-save semantic-release @semantic-release/git conventional-changelog-conventionalcommits semantic-release-pypi
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Upload distributions
        id: distributions
        if: hashFiles('dist/*.whl') != ''
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openmeteo-requests/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
