# Release system depends on:
# - .releaserc.json (make sure to select the right branch)
# - .github/workflows/semantic-pr-check.yml

name: Release

#on:
#  push:
#    branches:
#      - main

# Only run releases manually
on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    outputs:
      released: ${{ steps.release.outputs.released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "^26.13.0"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install semantic-release
        run: |
          npm install --no-save semantic-release@26 @semantic-release/git conventional-changelog-conventionalcommits semantic-release-pypi
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import semanticRelease from 'semantic-release';
          import { appendFileSync } from 'node:fs';
          const result = await semanticRelease();
          appendFileSync(process.env.GITHUB_OUTPUT, `released=${Boolean(result)}\n`);
          JS
      - name: Upload distributions
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/openmeteo-requests/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
